<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>家計簿</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#333333">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家計簿">

  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ホーム画面 -->
  <section id="page-home" class="page">
    <header>
      <div class="month-nav">
        <div class="month-nav-left"></div>
        <div class="month-nav-center">
          <button id="home-prev-month" class="nav-btn">◀</button>
          <span id="home-current-month">2026年9月</span>
          <button id="home-next-month" class="nav-btn">▶</button>
        </div>
        <div class="month-nav-right">
          <button id="home-today-btn" class="today-btn">今日</button>
        </div>
      </div>
    </header>
    <div class="page-content">
      <div class="home-total">
        <div class="home-total-amount" id="home-total-amount">¥0</div>
      </div>
      <div class="chart-container">
        <canvas id="home-chart"></canvas>
      </div>
      <div id="home-empty" class="empty-message" style="display:none;">
        記録がありません
      </div>
    </div>
  </section>

  <!-- カレンダー画面 -->
  <section id="page-calendar" class="page active">
    <header>
      <div class="month-nav">
        <div class="month-nav-left"></div>
        <div class="month-nav-center">
          <button id="prev-month" class="nav-btn">◀</button>
          <span id="current-month">2026年9月</span>
          <button id="next-month" class="nav-btn">▶</button>
        </div>
        <div class="month-nav-right">
          <button id="today-btn" class="today-btn">今日</button>
        </div>
      </div>
    </header>
    <div class="page-content">
      <div id="calendar-container"></div>
      <div class="month-total">
        今月合計: <span id="month-total-amount">¥0</span>
      </div>
    </div>
  </section>

  <!-- 設定画面 -->
  <section id="page-settings" class="page">
    <header>
      <h1>設定</h1>
    </header>
    <div class="page-content">
      <p class="placeholder">設定機能はフェーズ5で実装します</p>
    </div>
  </section>

  <!-- 下部タブナビゲーション -->
  <nav id="tab-nav">
    <button class="tab-btn" data-page="home">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">ホーム</span>
    </button>
    <button class="tab-btn active" data-page="calendar">
      <span class="tab-icon">📅</span>
      <span class="tab-label">カレンダー</span>
    </button>
    <button class="tab-btn" data-page="settings">
      <span class="tab-icon">⚙</span>
      <span class="tab-label">設定</span>
    </button>
  </nav>

  <!-- 日付モーダル -->
  <div id="date-modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-date-title">9月18日（水）</h2>
        <button id="modal-close" class="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- JS で描画 -->
      </div>
      <div class="modal-footer">
        <button id="add-transaction-btn" class="primary-btn">+ 新規追加</button>
      </div>
    </div>
  </div>

  <!-- 入力フォームモーダル -->
  <div id="form-modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <button id="form-back-btn" class="back-btn">◀ 戻る</button>
        <h2 id="form-title">新規追加</h2>
        <button type="button" id="form-save-btn" class="save-btn">保存</button>
      </div>
      <div class="modal-body">
        <form id="transaction-form">
          <label>
            日付
            <input type="date" id="date-input" required>
          </label>
          <label>
            カテゴリ
            <select id="category-select" required></select>
          </label>
          <label>
            金額
            <input type="number" id="amount-input" min="1" max="99999999" required inputmode="numeric" placeholder="0">
            <span class="unit">円</span>
          </label>
          <label>
            メモ
            <input type="text" id="memo-input" placeholder="任意">
          </label>
        </form>
        <button type="button" id="form-delete-btn" class="delete-btn" style="display:none;">削除</button>
      </div>
    </div>
  </div>

  <!-- Chart.js（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <script src="js/db.js"></script>
  <script src="js/holidays.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
