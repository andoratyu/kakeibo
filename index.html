<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>家計簿</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#333333">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家計簿">

  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img class="icon" src="icons/apple-touch-icon.png" alt="家計簿">
    <h1>家計簿</h1>
  </header>

  <main>
    <!-- 入力フォーム -->
    <section class="input-section">
      <h2>支出を記録</h2>
      <form id="transaction-form">
        <label>
          日付
          <input type="date" id="date-input" required>
        </label>
        <label>
          カテゴリ
          <select id="category-select" required></select>
        </label>
        <label>
          金額
          <input type="number" id="amount-input" min="1" max="99999999" required placeholder="1000">
        </label>
        <label>
          メモ
          <input type="text" id="memo-input" placeholder="任意">
        </label>
        <button type="submit">記録する</button>
      </form>
    </section>

    <!-- 一覧表示 -->
    <section class="list-section">
      <h2>記録一覧</h2>
      <p id="total-display">合計: ¥0</p>
      <ul id="transaction-list"></ul>
    </section>
  </main>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
