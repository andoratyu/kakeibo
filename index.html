<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>家計簿</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#333333">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家計簿">

  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ホーム画面 -->
  <section id="page-home" class="page">
    <header>
      <div class="month-nav">
        <div class="month-nav-left"></div>
        <div class="month-nav-center">
          <button id="home-prev-month" class="nav-btn">◀</button>
          <span id="home-current-month">2026年9月</span>
          <button id="home-next-month" class="nav-btn">▶</button>
        </div>
        <div class="month-nav-right">
          <button id="home-today-btn" class="today-btn">今日</button>
        </div>
      </div>
    </header>
    <div class="page-content">
      <div class="home-total">
        <div class="home-total-amount" id="home-total-amount">¥0</div>
        <div class="month-diff" id="home-month-diff"></div>
      </div>
      <div class="chart-container">
        <canvas id="home-chart"></canvas>
      </div>
      <div id="home-empty" class="empty-message" style="display:none;">
        記録がありません
      </div>
      <div id="home-category-list" class="category-list"></div>
    </div>
  </section>

  <!-- カレンダー画面 -->
  <section id="page-calendar" class="page active">
    <header>
      <div class="month-nav">
        <div class="month-nav-left"></div>
        <div class="month-nav-center">
          <button id="prev-month" class="nav-btn">◀</button>
          <span id="current-month">2026年9月</span>
          <button id="next-month" class="nav-btn">▶</button>
        </div>
        <div class="month-nav-right">
          <button id="today-btn" class="today-btn">今日</button>
        </div>
      </div>
    </header>
    <div class="page-content">
      <div id="calendar-container"></div>
      <div class="month-total">
        <div>今月合計: <span id="month-total-amount">¥0</span></div>
        <div class="month-diff" id="calendar-month-diff"></div>
      </div>
    </div>
  </section>

  <!-- 設定画面 -->
  <section id="page-settings" class="page">
    <header>
      <h1>設定</h1>
    </header>
    <div class="page-content">
      <div class="settings-section">
        <div class="settings-section-header">
          <h2>固定費設定</h2>
          <button id="add-recurring-btn" class="add-btn">+ 追加</button>
        </div>
        <p class="settings-hint">毎日・毎週・毎月の定期支出を自動で記録します。登録日以降の該当日に自動追加されます。</p>
        <div id="recurring-list" class="recurring-list"></div>
      </div>

      <div class="settings-section">
        <div class="settings-section-header">
          <h2>カテゴリ管理</h2>
          <button id="add-category-btn" class="add-btn">+ 追加</button>
        </div>
        <p class="settings-hint">大カテゴリ・小カテゴリを管理できます。「固定費」「その他」は削除・名前変更できません。</p>
        <div id="category-list" class="category-mgmt-list"></div>
      </div>

      <div class="settings-section">
        <h2>データ管理</h2>
        <div class="csv-export-group">
          <div class="csv-export-title">月次エクスポート</div>
          <div class="csv-export-selectors">
            <select id="export-year"></select>
            <span>年</span>
            <select id="export-month"></select>
            <span>月</span>
            <button id="export-month-btn" class="add-btn">DL</button>
          </div>
        </div>
        <div class="csv-export-group">
          <button id="export-all-btn" class="export-all-btn">全期間をエクスポート</button>
        </div>
        <p class="settings-hint" style="margin-top:12px;">Safariの「ダウンロード」フォルダに保存されます。CSVインポートは次のフェーズで実装します。</p>
      </div>
    </div>
  </section>

  <!-- 下部タブナビゲーション -->
  <nav id="tab-nav">
    <button class="tab-btn" data-page="home">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">ホーム</span>
    </button>
    <button class="tab-btn active" data-page="calendar">
      <span class="tab-icon">📅</span>
      <span class="tab-label">カレンダー</span>
    </button>
    <button class="tab-btn" data-page="settings">
      <span class="tab-icon">⚙</span>
      <span class="tab-label">設定</span>
    </button>
  </nav>

  <!-- バージョン表示（右下） -->
  <div id="version-badge">v-</div>

  <!-- 日付モーダル -->
  <div id="date-modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-date-title">9月18日（水）</h2>
        <button id="modal-close" class="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button id="add-transaction-btn" class="primary-btn">+ 新規追加</button>
      </div>
    </div>
  </div>

  <!-- 入力フォームモーダル -->
  <div id="form-modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <button id="form-back-btn" class="back-btn">◀ 戻る</button>
        <h2 id="form-title">新規追加</h2>
        <button type="button" id="form-save-btn" class="save-btn">保存</button>
      </div>
      <div class="modal-body">
        <form id="transaction-form">
          <label>
            日付
            <input type="date" id="date-input" required>
          </label>
          <label>
            大カテゴリ
            <select id="category-select" required></select>
          </label>
          <label>
            小カテゴリ
            <select id="subcategory-select">
              <option value="">（なし）</option>
            </select>
          </label>
          <label>
            金額
            <input type="number" id="amount-input" min="1" max="99999999" required inputmode="numeric" placeholder="0">
            <span class="unit">円</span>
          </label>
          <label>
            メモ
            <input type="text" id="memo-input" placeholder="任意">
          </label>
        </form>
        <button type="button" id="form-delete-btn" class="delete-btn" style="display:none;">削除</button>
      </div>
    </div>
  </div>

  <!-- 固定費追加/編集モーダル -->
  <div id="recurring-modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <button id="recurring-back-btn" class="back-btn">◀ 戻る</button>
        <h2 id="recurring-title">固定費を追加</h2>
        <button type="button" id="recurring-save-btn" class="save-btn">保存</button>
      </div>
      <div class="modal-body">
        <form id="recurring-form">
          <label>
            周期
            <div class="frequency-tabs">
              <button type="button" class="freq-btn active" data-freq="monthly">毎月</button>
              <button type="button" class="freq-btn" data-freq="weekly">毎週</button>
              <button type="button" class="freq-btn" data-freq="weekday">平日</button>
              <button type="button" class="freq-btn" data-freq="daily">毎日</button>
            </div>
          </label>
          <label id="day-of-month-label">
            日付
            <select id="day-of-month-select">
              <!-- JSで生成 -->
            </select>
          </label>
          <label id="day-of-week-label" style="display:none;">
            曜日
            <select id="day-of-week-select">
              <option value="0">日曜日</option>
              <option value="1">月曜日</option>
              <option value="2">火曜日</option>
              <option value="3">水曜日</option>
              <option value="4">木曜日</option>
              <option value="5">金曜日</option>
              <option value="6">土曜日</option>
            </select>
          </label>
          <label>
            名前（小カテゴリ）
            <input type="text" id="recurring-name-input" required placeholder="家賃、Netflix、ジム 等" maxlength="20">
          </label>
          <label>
            金額
            <input type="number" id="recurring-amount-input" min="1" max="99999999" required inputmode="numeric" placeholder="0">
            <span class="unit">円</span>
          </label>
          <label>
            メモ
            <input type="text" id="recurring-memo-input" placeholder="任意" maxlength="30">
          </label>
        </form>
        <button type="button" id="recurring-delete-btn" class="delete-btn" style="display:none;">削除</button>
      </div>
    </div>
  </div>

    <!-- カテゴリ追加/編集モーダル -->
  <div id="category-modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <button id="category-back-btn" class="back-btn">◀ 戻る</button>
        <h2 id="category-modal-title">カテゴリを追加</h2>
        <button type="button" id="category-save-btn" class="save-btn">保存</button>
      </div>
      <div class="modal-body">
        <form id="category-form">
          <label id="category-type-label">
            種類
            <div class="frequency-tabs">
              <button type="button" class="cat-type-btn active" data-type="parent">大カテゴリ</button>
              <button type="button" class="cat-type-btn" data-type="child">小カテゴリ</button>
            </div>
          </label>
          <label id="category-parent-label" style="display:none;">
            親カテゴリ
            <select id="category-parent-select"></select>
          </label>
          <label>
            名前
            <input type="text" id="category-name-input" required maxlength="20" placeholder="例: 食費 or 外食">
          </label>
        </form>
        <button type="button" id="category-delete-btn" class="delete-btn" style="display:none;">削除</button>
      </div>
    </div>
  </div>

  <!-- Chart.js（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Chart.js（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <script src="js/version.js"></script>
  <script src="js/db.js"></script>
  <script src="js/holidays.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
